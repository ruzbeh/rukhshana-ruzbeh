<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5efe5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14171d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Our wedding">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Our wedding · Ruzbeh &amp; Rukhshana</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f5efe5'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' text-anchor='middle' fill='%23a07a3c'%3ER%26R%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap">
  <link rel="stylesheet" href="dashboard.css?v=2">
</head>
<body>
  <div class="demo-banner" id="demo-banner" hidden>Sample data · not your guests</div>

  <div class="shell" id="app" hidden>
    <header class="masthead">
      <div class="masthead-row">
        <div>
          <p class="countdown" id="countdown"></p>
          <h1 class="couple">Ruzbeh <span class="amp">&amp;</span> Rukhshana</h1>
        </div>
        <button class="icon-button" id="refresh" type="button" aria-label="Refresh from the sheet">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4.8h-4.8"/></svg>
        </button>
      </div>
      <p class="updated" id="updated" aria-live="polite"></p>
    </header>

    <div class="sides-bar">
      <div class="sides" role="group" aria-label="Whose guests">
        <button type="button" data-side="all">Everyone</button>
        <button type="button" data-side="ruzbeh"><i class="dot dot--ruzbeh"></i>Ruzbeh</button>
        <button type="button" data-side="rukhshana"><i class="dot dot--rukhshana"></i>Rukhshana</button>
      </div>
    </div>

    <main id="main" tabindex="-1"></main>

    <nav class="tabs" aria-label="Sections">
      <button type="button" data-view="overview">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v9H4zM13 11h7v9h-7zM4 15h7v5H4zM13 4h7v5h-7z"/></svg>
        <span>Overview</span>
      </button>
      <button type="button" data-view="waiting">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        <span>Waiting</span><b class="badge" id="badge-waiting" hidden></b>
      </button>
      <button type="button" data-view="replies">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6h17v12h-17z"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></svg>
        <span>Replies</span>
      </button>
      <button type="button" data-view="gifts">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 11h15v9h-15zM3.5 7.5h17V11h-17zM12 7.5V20"/><path d="M12 7.5C10.5 4.5 7 4 7 6s2.5 1.5 5 1.5zm0 0c1.5-3 5-3.5 5-1.5s-2.5 1.5-5 1.5z"/></svg>
        <span>Gifts</span><b class="badge" id="badge-gifts" hidden></b>
      </button>
    </nav>
  </div>

  <section class="connect" id="connect" hidden>
    <div class="connect-card">
      <p class="countdown">Just for the two of you</p>
      <h1 class="couple">Ruzbeh <span class="amp">&amp;</span> Rukhshana</h1>
      <p class="connect-text" id="connect-text">Open your private dashboard link. It is in the Summary tab of the RSVP sheet.</p>
      <form id="connect-form" class="connect-form">
        <label class="field">
          <span>Dashboard link</span>
          <input id="connect-key" name="key" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://…/dashboard/#k=…" required>
        </label>
        <label class="field" id="connect-endpoint-field" hidden>
          <span>Web app URL</span>
          <input id="connect-endpoint" name="endpoint" type="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">
        </label>
        <button class="button button--primary" type="submit">Open dashboard</button>
      </form>
    </div>
  </section>

  <dialog class="sheet" id="gift-dialog" aria-labelledby="gift-title">
    <form method="dialog" id="gift-form" class="sheet-body">
      <div class="sheet-head">
        <h2 id="gift-title">Add a gift</h2>
        <button class="icon-button" type="button" id="gift-close" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <label class="field">
        <span>From</span>
        <input name="from" list="gift-names" autocomplete="off" required maxlength="200" placeholder="Who gave it">
      </label>
      <label class="field">
        <span>Gift</span>
        <input name="gift" autocomplete="off" maxlength="200" placeholder="Envelope, silver frame…">
      </label>
      <label class="field field--amount">
        <span>Amount <small>(if cash)</small></span>
        <input name="amount" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="₹">
      </label>
      <label class="field">
        <span>Note</span>
        <input name="note" autocomplete="off" maxlength="500" placeholder="Anything to mention in the thank-you">
      </label>
      <label class="toggle">
        <input type="checkbox" name="thanked">
        <span>Thank-you sent</span>
      </label>
      <p class="form-error" id="gift-error" role="alert" hidden></p>
      <div class="sheet-actions">
        <button class="button button--quiet" type="button" id="gift-delete" hidden>Delete</button>
        <button class="button button--primary" type="submit" id="gift-save">Save</button>
      </div>
    </form>
  </dialog>
  <datalist id="gift-names"></datalist>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="dashboard.js?v=2"></script>
</body>
</html>
